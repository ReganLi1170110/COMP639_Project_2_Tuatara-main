<div class="modal fade" id="claimBadgeModal" tabindex="-1" aria-labelledby="claimBadgeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="claimBadgeModalLabel">Claim Physical Badge</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3">Free postage within New Zealand</p>
        <div class="mb-3">
          <strong>Badge:</strong> <span id="claimBadgeName"></span>
        </div>
        <form id="claimBadgeForm">
          <input type="hidden" id="claimBadgeId" name="badge_id">

          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input id="fullName" name="full_name" class="form-control" type="text" autocomplete="name" required>
          </div>

          <div class="mb-3">
            <label for="streetAddress" class="form-label">Street Address</label>
            <input id="streetAddress" name="street_address" class="form-control" type="text" autocomplete="street-address" required>
          </div>

          <div class="mb-3">
            <label for="suburb" class="form-label">Suburb</label>
            <input id="suburb" name="suburb" class="form-control" type="text" required>
          </div>

          <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input id="city" name="city" class="form-control" type="text" autocomplete="address-level2" required>
          </div>

          <div class="mb-3">
            <label for="postcode" class="form-label">Postcode</label>
            <input id="postcode" name="postcode" class="form-control" type="text" autocomplete="postal-code" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="claimBadgeForm" class="btn btn-primary">Submit Claim</button>
      </div>
    </div>
  </div>
</div>
